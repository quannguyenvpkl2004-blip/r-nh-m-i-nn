<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Phương... 🌕✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Nền trời đêm gradient */
            background: linear-gradient(to bottom, #020111 0%, #20124d 60%, #000022 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Baloo 2', 'Comic Sans MS', sans-serif;
            overflow: hidden;
            color: white;
            position: relative;
        }

        /* ----- MÀN HÌNH CHỜ (Bấm vào để phát nhạc) ----- */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .btn-start {
            font-size: 1.5rem;
            padding: 15px 30px;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff99cc, #ff66b2);
            color: white;
            border: none;
            box-shadow: 0 0 20px #ff66b2;
            animation: pulseBtn 1.5s infinite alternate;
            pointer-events: none; /* Để click dính vào start-screen */
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 10px #ff66b2; }
            100% { transform: scale(1.1); box-shadow: 0 0 30px #ff3399; }
        }

        /* ----- BẦU TRỜI SAO VÀ TRĂNG RẰM ----- */
        #stars-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8); }
        }

        .moon {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #fff9e6, #fde482, #d4af37);
            border-radius: 50%;
            box-shadow: 0 0 50px 10px rgba(253, 228, 130, 0.6), 
                        0 0 100px 30px rgba(253, 228, 130, 0.3);
            z-index: 1;
            animation: moonFloat 6s ease-in-out infinite alternate;
        }

        @keyframes moonFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        /* ----- HIỆU ỨNG CHỮ ----- */
        #text-container {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
            z-index: 10;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
            max-width: 80%;
        }

        .show-text {
            opacity: 1 !important;
            transform: scale(1) translateY(0) !important;
        }

        .final-text {
            font-size: 3.5rem !important;
            color: #ffccff;
            text-shadow: 0 0 15px #ff66b2, 0 0 30px #ff1a8c, 0 0 50px #ff0080;
            animation: floatText 3s ease-in-out infinite alternate;
        }

        @keyframes floatText {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.05); }
        }

        /* Vùng chứa sao rơi lúc cuối */
        #magic-sky {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- BỘ PHÁT NHẠC (Mình dùng 1 bản nhạc Lofi Chill mặc định) -->
    <!-- Nếu muốn đổi nhạc, bạn chỉ cần thay link trong thẻ src="..." bên dưới -->
    <audio id="bg-music" loop>
        <source <source src="nhacnen.mp3" type="audio/mpeg">>
    </audio>

    <!-- MÀN HÌNH CHỜ CLICK -->
    <div id="start-screen">
        <h2 style="margin-bottom: 20px; color: #fff;">Có một điều bí mật dành cho cậu...</h2>
        <div class="btn-start">Chạm vào đây để mở 🎁</div>
    </div>

    <!-- BỐI CẢNH NỀN -->
    <div id="stars-container"></div>
    <div class="moon"></div>

    <!-- CHỮ HIỂN THỊ -->
    <div id="text-container"></div>

    <!-- KHU VỰC HIỆU ỨNG RƠI KHI KẾT THÚC -->
    <div id="magic-sky"></div>

    <script>
        // 1. TẠO BẦU TRỜI ĐẦY SAO LẤP LÁNH
        const starsContainer = document.getElementById('stars-container');
        const numberOfStars = 150; // Số lượng sao
        
        for (let i = 0; i < numberOfStars; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            
            // Kích thước ngẫu nhiên (từ 1px đến 3px)
            let size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            // Vị trí ngẫu nhiên trên màn hình
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            
            // Tốc độ nhấp nháy ngẫu nhiên
            star.style.animationDuration = Math.random() * 2 + 1 + 's';
            
            starsContainer.appendChild(star);
        }

        // 2. KỊCH BẢN CHỮ
        const messages = [
            "Trăng rằm Trung Thu hôm nay sáng thật đấy 🌕",
            "Nhưng tớ đoán là...",
            "Vẫn có người đang thức giờ này đúng không? 🤨",
            "Cả ngày hôm nay cậu đã vất vả rồi...",
            "Bây giờ, hãy thả lỏng người ra nào ☁️",
            "Bật một chút nhạc chill...",
            "Nhắm mắt lại và để những muộn phiền bay đi hết ✨",
            "Chúc Phương ngủ thật ngon nhé! 🌙💖🐱"
        ];

        let currentIndex = 0;
        const textContainer = document.getElementById('text-container');
        const startScreen = document.getElementById('start-screen');
        const bgMusic = document.getElementById('bg-music');
        const magicSky = document.getElementById('magic-sky');
        const emojis = ['⭐', '✨', '🌕', '💖', '🐰', '🏮']; // Thêm icon Thỏ ngọc và Lồng đèn cho hợp Trung Thu

        // XỬ LÝ KHI NGƯỜI DÙNG BẤM NÚT START
        startScreen.addEventListener('click', function() {
            // Mờ dần và ẩn màn hình chờ
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 1000);

            // Bật nhạc nền
            bgMusic.volume = 0.5; // Âm lượng 50%
            bgMusic.play();

            // Đợi 1 giây rồi bắt đầu chạy chữ
            setTimeout(showNextMessage, 1000);
        });

        function showNextMessage() {
            if (currentIndex < messages.length) {
                textContainer.innerHTML = messages[currentIndex];
                textContainer.classList.add('show-text');

                const isFinalMessage = currentIndex === messages.length - 1;

                if (isFinalMessage) {
                    textContainer.classList.add('final-text');
                    startMagicRain(); 
                }

                const displayTime = isFinalMessage ? 9999999 : 3000; // Mỗi câu dừng lại 3 giây

                setTimeout(() => {
                    if (!isFinalMessage) {
                        textContainer.classList.remove('show-text');
                        setTimeout(() => {
                            currentIndex++;
                            showNextMessage();
                        }, 800); 
                    }
                }, displayTime);
            }
        }

        // HIỆU ỨNG RƠI LÚC KẾT THÚC
        function startMagicRain() {
            setInterval(() => {
                const element = document.createElement('div');
                element.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                element.style.position = 'absolute';
                element.style.left = Math.random() * 100 + 'vw';
                element.style.fontSize = Math.random() * 20 + 20 + 'px'; // Icon to hơn chút
                element.style.opacity = Math.random() * 0.8 + 0.2;
                
                const duration = Math.random() * 4 + 4;
                element.style.animation = `fall ${duration}s linear forwards`;
                
                magicSky.appendChild(element);

                setTimeout(() => {
                    element.remove();
                }, duration * 1000);
            }, 400); // Tần suất rơi
        }
    </script>
</body>
</html>
